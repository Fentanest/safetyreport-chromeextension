name: Build Chrome extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, "235"]
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build configured extension
        run: npm run build
        env:
          SR_SUPABASE_URL: ${{ vars.SR_SUPABASE_URL }}
          SR_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SR_SUPABASE_PUBLISHABLE_KEY }}

      - name: Package extension
        run: npm run package

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: safetyreport-extension-${{ github.sha }}
          path: artifacts/safetyreport-extension-*.zip
          if-no-files-found: error
          retention-days: 1
